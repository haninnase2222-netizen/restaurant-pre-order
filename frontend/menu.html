<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Digital Menu</title>
</head>
<body>
  <h1>Cafeteria Menu</h1>
  <ul id="menu"></ul>

  <script>
    fetch("http://127.0.0.1:5000/api/menu")
      .then(res => res.json())
      .then(items => {
        const list = document.getElementById("menu");
        items.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item.name + " - " + item.category + " - $" + item.price;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
